<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetKu - Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>DompetKu Tracker</h2>

        <!-- Ringkasan Saldo -->
        <div class="balance-card">
            <h4>Total Saldo</h4>
            <h1 id="total-balance">Rp 0</h1>
            <div class="summary-container">
                <div class="summary-item income">
                    <span>Pemasukan</span>
                    <p id="total-income">Rp 0</p>
                </div>
                <div class="summary-item expense">
                    <span>Pengeluaran</span>
                    <p id="total-expense">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="form-container">
            <h3>Tambah Transaksi Baru</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="text">Keterangan</label>
                    <input type="text" id="text" placeholder="Contoh: Gaji, Makan Siang..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Jumlah (Rp)</label>
                    <input type="number" id="amount" placeholder="Masukkan angka..." required>
                </div>
                <div class="form-group">
                    <label for="type">Tipe Transaksi</label>
                    <select id="type" required>
                        <option value="income">Pemasukan (+)</option>
                        <option value="expense">Pengeluaran (-)</option>
                    </select>
                </div>
                <button type="submit" class="btn">Simpan Transaksi</button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <h3>Riwayat Transaksi</h3>
        <ul id="transaction-list" class="transaction-list">
            <!-- Data akan diisi otomatis lewat JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
